name: CI review summary

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: read
  issues: write
  pull-requests: read

jobs:
  summarize:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.actor.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - name: Locate pull request for the validated commit
        id: pull-request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          number=$(gh api \
            "repos/${{ github.repository }}/commits/${{ github.event.workflow_run.head_sha }}/pulls" \
            --jq '.[0].number')
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Publish CI summary
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ steps.pull-request.outputs.number }}" \
            --repo "${{ github.repository }}" \
            --body "✅ CI concluído com sucesso. Os checks automáticos passaram; o merge continua sujeito à revisão manual."
